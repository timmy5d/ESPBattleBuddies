; BattleBuddies firmware for the ESP32-2432S028R ("Cheap Yellow Display")
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    h2zero/NimBLE-Arduino@1.4.3
build_src_filter = +<*> -<round/>
build_flags =
    -Os
    ; ---- TFT_eSPI setup for the CYD (display on HSPI) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    ; Some CYD variants (often the ones with two USB ports) show inverted
    ; colours. If yours does, uncomment the next line.
    ; -DTFT_INVERSION_ON=1

; BattleBuddies for the Waveshare ESP32-S3-Touch-AMOLED-1.43 (466x466 round
; AMOLED; the CNC metal case version is the "-1.43-B"). Same game and saves,
; with its own screen layer in src/round/ (see the README).
[env:amoled143]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<main.cpp> -<hw.cpp>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -Os
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI is only used to draw into an off-screen canvas (fonts, shapes,
    ; buddies); src/round/display.cpp sends it to the AMOLED over QSPI.
    ; The library still wants a panel setup, so give it one it never uses.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=466
    -DTFT_HEIGHT=466
    -DTFT_MOSI=1
    -DTFT_SCLK=2
    -DTFT_DC=3
    -DTFT_CS=-1
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
