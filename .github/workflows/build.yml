name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: pio run -e cyd -e amoled143
      - uses: actions/upload-artifact@v4
        with:
          name: battlebuddies-firmware
          path: .pio/build/cyd/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: battlebuddies-amoled143-firmware
          path: .pio/build/amoled143/firmware.bin
